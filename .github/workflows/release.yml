# .github/workflows/release.yml

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-upload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            shell: bash
            script: ./scripts/build_and_package_unix.sh

          - os: macos-15-intel
            target: x86_64-apple-darwin
            shell: bash
            script: ./scripts/build_and_package_unix.sh

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            shell: bash
            script: ./scripts/build_and_package_unix.sh

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            shell: bash
            script: ./scripts/build_and_package_unix.sh

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            shell: pwsh
            script: ./scripts/build_and_package_windows.ps1

          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            shell: pwsh
            script: ./scripts/build_and_package_windows.ps1

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Install Rust toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build + package ALL workspace binaries
        env:
          TARGET: ${{ matrix.target }}
        run: ${{ matrix.script }}

      - name: Upload to GitHub Release (PAT)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          files: "*.zip"

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    needs: build-and-upload
    permissions:
      contents: read
      id-token: write 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # - name: Test
      #   run: cargo test --all-features --locked

      - name: Trusted Publishing token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish -p conda_share --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}